plugins {
    id 'buildlogic.java17-conventions'
}

dependencies {
    testImplementation libs.junit.junit
    api project(':flovira-core')
    api libs.tools.jackson.core.jackson.databind
}

description = 'flovira-plugin-json-jackson3'

sourceSets.test {
    java.srcDir('../src/contractTest/java')
    resources.srcDir(rootProject.file('flovira-core/src/test/resources'))
}
