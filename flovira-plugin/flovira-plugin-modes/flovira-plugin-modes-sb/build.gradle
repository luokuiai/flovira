/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':flovira-core')
    api project(':flovira-mybatis-core')
    api project(':flovira-mybatis-plus-core')
    api libs.org.springframework.boot.spring.boot
    api libs.org.springframework.boot.spring.boot.autoconfigure
    api libs.org.springframework.spring.context
    api libs.org.springframework.spring.tx
    api libs.org.springframework.boot.spring.boot.configuration.processor
    compileOnly libs.com.google.code.findbugs.jsr305
    testImplementation libs.junit.junit
    testImplementation project(':flovira-plugin-json-jackson')
}

description = 'flovira-plugin-modes-sb'

sourceSets.test.resources.srcDir(rootProject.file('flovira-core/src/test/resources'))
