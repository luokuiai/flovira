services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flovira_example
      POSTGRES_USER: flovira
      POSTGRES_PASSWORD: flovira
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/postgresql/flovira-v1.sql:/docker-entrypoint-initdb.d/01-flovira.sql:ro
      - ./backend/postgres/src/main/resources/db/example-v1.sql:/docker-entrypoint-initdb.d/02-example.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flovira -d flovira_example"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: flovira_example
      MYSQL_USER: flovira
      MYSQL_PASSWORD: flovira
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/mysql/flovira-v1.sql:/docker-entrypoint-initdb.d/01-flovira.sql:ro
      - ./backend/mysql/src/main/resources/db/example-v1.sql:/docker-entrypoint-initdb.d/02-example.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uflovira", "-pflovira"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  mysql-data:
