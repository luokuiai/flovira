name: Publish to Maven Central

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: maven-central-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve publication version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use the vX.Y.Z format: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            echo "PUBLISH_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_VERSION=1.0.0-${GITHUB_SHA::7}-SNAPSHOT" >> "$GITHUB_ENV"
          fi

      - name: Run checks
        run: ./gradlew clean check -PreleaseVersion="$PUBLISH_VERSION" --no-daemon --no-parallel --max-workers=2

      - name: Publish snapshot
        if: github.ref == 'refs/heads/main'
        run: ./gradlew publishToMavenCentral -PreleaseVersion="$PUBLISH_VERSION" --no-daemon --no-parallel --max-workers=2

      - name: Publish release
        if: github.ref_type == 'tag'
        run: ./gradlew publishAndReleaseToMavenCentral -PreleaseVersion="$PUBLISH_VERSION" --no-daemon --no-parallel --max-workers=2
