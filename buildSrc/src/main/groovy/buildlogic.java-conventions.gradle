/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

group = 'com.luokuiai'
version = findProperty('releaseVersion') ?: '1.0.0'
java.sourceCompatibility = JavaVersion.VERSION_1_8

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)

            pom {
                name = project.name
                description = "Flovira workflow engine module ${project.name}"
                url = 'https://github.com/luokuiai/flovira'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'warm'
                        name = 'Warm-Flow'
                        email = '290631660@qq.com'
                    }
                    developer {
                        id = 'luokuiai'
                        name = 'Luokuiai'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/luokuiai/flovira.git'
                    developerConnection = 'scm:git:ssh://git@github.com/luokuiai/flovira.git'
                    url = 'https://github.com/luokuiai/flovira'
                }
            }
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar) {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all,-missing', true)
    options.quiet()
}
