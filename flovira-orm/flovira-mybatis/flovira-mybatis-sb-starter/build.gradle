/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':flovira-mybatis-core')
    api libs.org.mybatis.spring.boot.mybatis.spring.boot.starter.x1
    api libs.org.springframework.spring.tx
    api project(':flovira-plugin-modes-sb')
    testImplementation libs.junit.junit
    testImplementation project(':flovira-plugin-json-jackson')
    testImplementation libs.org.postgresql.postgresql
    testImplementation libs.org.testcontainers.postgresql
}

sourceSets.test.java.srcDir rootProject.file('flovira-orm/src/contractTest/java')
sourceSets.test.resources.srcDir rootProject.file('flovira-orm/src/contractTest/resources')

description = 'flovira-mybatis-sb-starter'
